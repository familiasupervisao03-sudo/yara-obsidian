[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "titan"
version = "0.1.0"
description = "TITAN — IA pessoal local com centro de comando tático (MVP, Fase 1)"
readme = "README.md"
requires-python = ">=3.10"
# Dependências mínimas de execução. Hash de senha usa hashlib.scrypt (stdlib)
# para evitar extensões nativas pesadas em hardware antigo.
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "sqlalchemy>=2.0.30,<2.1",
  "alembic>=1.13,<2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1,<4"]
# Provedor EXTERNO e PAGO; só instale se for usar (ver docs/anthropic.md).
anthropic = ["anthropic>=1.15,<2"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
titan = "titan.cli:main"

[tool.setuptools.packages.find]
where = [".", "apps/api"]
include = ["titan*", "titan_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient`",
]
markers = [
  "postgres: requer PostgreSQL acessível via TITAN_TEST_DATABASE_URL",
]
