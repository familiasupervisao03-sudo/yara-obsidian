plugins { id "com.android.application" }

// Assinatura: chave fora do repositório (ver apps/android/README.md).
def ks = System.getenv("TITAN_KEYSTORE")

android {
    namespace "br.titan.app"
    compileSdk 34
    defaultConfig {
        applicationId "br.titan.app"
        minSdk 24          // Android 7+ (o Galaxy A20 tem Android 9–11)
        targetSdk 34
    }
    buildFeatures { buildConfig true }
    // Um projeto, dois apps (mesma mãe): o TITAN e o TITAN Casa (central da casa no tablet).
    // Instalam lado a lado: cada um tem o seu applicationId.
    flavorDimensions "app"
    productFlavors {
        titan {
            dimension "app"
            applicationId "br.titan.app"
            versionCode 6
            versionName "1.5"
            buildConfigField "String", "HOME", '"/"'
            buildConfigField "String", "SCHEME", '"titan"'
            buildConfigField "boolean", "CASA", "false"
            manifestPlaceholders = [appLabel: "TITAN", scheme: "titan"]
        }
        casa {
            dimension "app"
            applicationId "br.titan.casa"
            versionCode 1
            versionName "1.0"
            buildConfigField "String", "HOME", '"/casa"'
            buildConfigField "String", "SCHEME", '"titancasa"'
            buildConfigField "boolean", "CASA", "true"
            manifestPlaceholders = [appLabel: "TITAN Casa", scheme: "titancasa"]
        }
    }
    signingConfigs {
        if (ks) {
            release {
                storeFile file(ks)
                storePassword System.getenv("TITAN_KEYSTORE_PASS")
                keyAlias "titan"
                keyPassword System.getenv("TITAN_KEYSTORE_PASS")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ks) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
